name: Best Scanners Email

on:
  schedule:
    # Once daily now (was twice) -- _evaluate() explicitly drops today's
    # still-forming daily bar before 4pm ET, so any two runs on the same day
    # before close were computing off the identical completed bar (that's
    # why they kept repeating the same tickers). One run after close gets
    # that day's genuinely fresh, final bar instead. Staggered 15 min after
    # overkill_scan_email.yml's own 5:00 PM CT slot so both jobs aren't
    # hitting yfinance at the exact same moment.
    # ── CDT (summer, Mar–Nov): UTC-5 ─────────────────────────────
    # 5:15 PM CDT = 22:15 UTC
    - cron: "15 22 * * 1-5"
    # ── CST (winter, Nov–Mar): UTC-6 ─────────────────────────────
    # 5:15 PM CST = 23:15 UTC   ← uncomment this and remove the CDT line in Nov
    # - cron: "15 23 * * 1-5"
  workflow_dispatch:          # Manual trigger from GitHub Actions UI
    inputs:
      slot:
        description: "Scan slot (am / pm)"
        required: true
        default: "am"
        type: choice
        options: [am, pm]

# Prevent two runs of the same slot from overlapping (e.g. duplicate cron fires).
concurrency:
  group: best-scanners-email-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.slot || 'auto' }}
  cancel-in-progress: false

permissions:
  contents: write          # allow the bot to commit + push the daily history snapshot

jobs:
  scan-and-email:
    name: Scan Best Scanners + Email
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Install everything from requirements.txt except streamlit (mocked in headless mode)
          grep -v "^streamlit" requirements.txt | pip install -r /dev/stdin

      - name: Determine scan slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "14" ] || [ "$HOUR" = "15" ]; then
              echo "slot=am" >> $GITHUB_OUTPUT
            else
              echo "slot=pm" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run Best Scanners scan + send email
        env:
          SCAN_SLOT:              ${{ steps.slot.outputs.slot }}
          GMAIL_ADDRESS:           ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD:      ${{ secrets.GMAIL_APP_PASSWORD }}
          OVERKILL_EMAIL_TO:       ${{ secrets.OVERKILL_EMAIL_TO }}
          # Set this secret instead if Best Scanners should go to a different
          # list than OverKill — otherwise it reuses OVERKILL_EMAIL_TO above.
          BEST_SCANNERS_EMAIL_TO:  ${{ secrets.BEST_SCANNERS_EMAIL_TO }}
          # ── Tune without editing code ──
          BEST_SCANNERS_UNIVERSE: "FTF"   # FTF (~480) / MTPA (200) / SP500 (200)
        run: python scripts/headless_best_scanners_scan.py

      - name: Commit history snapshot JSON
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/best_scanners/*.json
          if git diff --cached --quiet; then
            echo "Nothing to commit — no history snapshot was written this run."
          else
            git commit -m "Best Scanners history snapshot $(date -u +'%Y-%m-%d %H:%M UTC') [${{ steps.slot.outputs.slot }}]"

            # Pull any remote commits made since checkout.
            # -X ours: on add/add conflict with today's own snapshot file
            # (duplicate cron fires), always keep THIS run's fresh data.
            if git pull --rebase -X ours origin main; then
              git push origin main
            else
              # Rebase left repo in a broken state — abort cleanly then force-push
              # our snapshot so it's never silently lost.
              echo "Rebase conflict could not be auto-resolved; force-pushing snapshot."
              git rebase --abort
              git push --force-with-lease origin main
            fi
          fi
