name: OverKill Shorts — Detect + Extract

on:
  schedule:
    # Once daily now (was twice, detect-only) -- the pipeline is now fully
    # automated end-to-end (detect -> fetch transcript -> Gemini extracts
    # picks -> writes straight into data/overkill_shorts.json), so there's
    # no human review step left to prompt twice a day for. One morning run
    # before market open covers whatever the channel posted since the last run.
    # ── CDT (summer, Mar–Nov): UTC-5 ─────────────────────────────
    # 7:00 AM CDT = 12:00 UTC
    - cron: "0 12 * * *"
    # ── CST (winter, Nov–Mar): UTC-6 ─────────────────────────────
    # 7:00 AM CST = 13:00 UTC   ← uncomment this and remove the CDT line in Nov
    # - cron: "0 13 * * *"
  workflow_dispatch:          # Manual trigger from GitHub Actions UI, or the
                               # "Refresh Now" button on the OverKill Shorts tab

permissions:
  contents: write          # allow the bot to commit + push extracted picks

# Prevent overlapping runs from duplicate cron fires.
concurrency:
  group: refresh-overkill-shorts
  cancel-in-progress: false

jobs:
  refresh:
    name: Detect + extract new OverKill Shorts
    # Self-hosted, not ubuntu-latest: GitHub-hosted runners sit on Google
    # Cloud IPs, which YouTube blocks outright from the transcript endpoint
    # (confirmed directly -- see this workflow's git history). A
    # self-hosted runner uses a residential IP instead, sidestepping the
    # block for free instead of paying for a proxy service. Requires a
    # runner registered against this repo and online at schedule time --
    # see the setup steps linked from the repo README / ask Claude.
    runs-on: [self-hosted]
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # No actions/setup-python step: its bundled Windows installer failed
      # on this self-hosted runner ("Error happened during Python
      # installation", no further detail given). Self-hosted runners
      # already have whatever's installed on the machine -- unlike
      # ephemeral GitHub-hosted runners, there's no need to provision
      # Python fresh each run.
      #
      # Called by FULL PATH below, not bare `python`/`pip` -- the runner
      # service almost certainly runs as a different Windows account (e.g.
      # SYSTEM) than the interactive user, which doesn't inherit that
      # user's PATH entries (confirmed: `pip` resolves fine interactively,
      # "not recognized" when this workflow runs it). Update this path if
      # Python is ever reinstalled/moved on this machine.
      - name: Install dependencies
        run: |
          & "C:\Users\llcai\AppData\Local\Programs\Python\Python314\python.exe" -m pip install --upgrade pip
          # youtube-transcript-api pinned to the 1.x line, NOT <1.0 -- an
          # earlier version of this workflow pinned <1.0 to keep the old
          # get_transcript() classmethod API, but that old version returns
          # a false "subtitles are disabled" against YouTube's current
          # backend (confirmed: identical video IDs fetch fine on 1.2.4,
          # fail on 0.6.3). Capped below 2.0 so a future breaking major
          # version doesn't silently break this unattended job.
          & "C:\Users\llcai\AppData\Local\Programs\Python\Python314\python.exe" -m pip install requests "youtube-transcript-api>=1.0,<2.0" google-genai

      - name: Run detection + extraction script
        env:
          YOUTUBE_API_KEY:  ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
        run: |
          & "C:\Users\llcai\AppData\Local\Programs\Python\Python314\python.exe" scripts\overkill_shorts_scan.py

      - name: Commit updated picks + pending list
        # Explicit bash: this step's script uses bash if/then/fi syntax and
        # $(...) command substitution. On ubuntu-latest that's the default
        # shell so it never needed stating -- on this Windows self-hosted
        # runner the default is PowerShell, which can't parse it at all.
        # Git for Windows (already required for checkout) ships bash too,
        # confirmed present, so this works without installing anything new.
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/overkill_shorts.json data/overkill_pending.json
          if git diff --cached --quiet; then
            echo "Nothing to commit — no new videos this run."
          else
            git commit -m "Update OverKill Shorts $(date -u +'%Y-%m-%d %H:%M UTC')"

            if git pull --rebase -X ours origin main; then
              git push origin main
            else
              echo "Rebase conflict could not be auto-resolved; force-pushing."
              git rebase --abort
              git push --force-with-lease origin main
            fi
          fi
