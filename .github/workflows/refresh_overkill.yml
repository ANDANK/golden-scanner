name: OverKill Shorts — Detect + Extract

on:
  schedule:
    # Once daily now (was twice, detect-only) -- the pipeline is now fully
    # automated end-to-end (detect -> fetch transcript -> Gemini extracts
    # picks -> writes straight into data/overkill_shorts.json), so there's
    # no human review step left to prompt twice a day for. One morning run
    # before market open covers whatever the channel posted since the last run.
    # NOTE: this schedule has not actually been dispatching. Two consecutive
    # slots (12:00 UTC Aug 13, 12:17 UTC Aug 14) produced no run at all -- the
    # self-hosted runner was Running and idle both times and no job ever
    # reached it, so this is GitHub-side, not a runner problem. Every OTHER
    # scheduled workflow in this repo fires reliably; the only difference here
    # is `runs-on: [self-hosted]`. Moving the minute off :00 did not help.
    # If it keeps skipping, trigger from the always-on machine instead
    # (Windows Task Scheduler) rather than relying on GitHub's cron.
    # Twice daily. These times are chosen around when the SELF-HOSTED MACHINE
    # is actually awake, which turned out to matter far more than market hours.
    #
    # An earlier version requested 5:30 AM to absorb GitHub's scheduler lag and
    # land the digest pre-open. That failed for a different reason: the laptop
    # hosting the runner enters connected standby overnight (confirmed in
    # Kernel-Power events 506/507 -- e.g. 10:25 UTC standby, 14:14 UTC resume).
    # A run dispatched into a sleeping machine either finds no runner at all,
    # or gets picked up, frozen mid-job, and fails on completion with
    # VssUnauthorizedException once its job token has expired -- exactly what
    # happened on 2026-08-15, where a 30-second job spanned 60 minutes with a
    # 59-minute dead gap in the middle.
    #
    # So: dispatch when the machine is reliably up, and accept that GitHub's
    # lag (~1-2h, best-effort) pushes actual start later than the requested
    # time. The morning digest will typically land mid-morning rather than
    # before the 8:30 open. Padding earlier to beat the open is not an option
    # -- it just aims the run at a sleeping laptop.
    #
    # ── CDT (summer, Mar–Nov): UTC-5 ─────────────────────────────
    # 8:10 AM CDT = 13:10 UTC   |   7:10 PM CDT = 00:10 UTC (next day)
    - cron: "10 13 * * *"
    - cron: "10 0 * * *"
    # ── CST (winter, Nov–Mar): UTC-6 ─────────────────────────────
    # 8:10 AM CST = 14:10 UTC   |   7:10 PM CST = 01:10 UTC
    # ← swap to these two and comment out the CDT pair in Nov
    # - cron: "10 14 * * *"
    # - cron: "10 1 * * *"
  workflow_dispatch:          # Manual trigger from GitHub Actions UI, or the
                              # "Refresh Now" button on the YouTube Shorts tab
    inputs:
      channels:
        description: >-
          Comma-separated channel handles to scan (e.g. @NolanGouveia,@ClearValueTax).
          Leave blank to scan every channel in scripts/yt_channels.py.
        required: false
        default: ""

permissions:
  contents: write          # allow the bot to commit + push extracted picks

# Scheduled and manual runs get SEPARATE concurrency groups. This previously
# used one static group shared by both event types, which is the single
# structural difference between this workflow and the three in this repo that
# have been firing on schedule reliably all along -- they all key their group
# on the event. With one shared group and cancel-in-progress: false, a manual
# run and a scheduled run compete for the same slot, and GitHub keeps only the
# newest pending run per group while cancelling the older one. That matches the
# symptom exactly: manual triggers always worked, scheduled ones never appeared,
# during a stretch of heavy manual triggering.
concurrency:
  group: refresh-overkill-shorts-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # A few seconds of GitHub-hosted time whose only purpose is to prove the
  # workflow actually fired. Every reliably-scheduled workflow in this repo
  # runs on ubuntu-latest; this was the only one whose sole job targeted a
  # self-hosted runner. If a schedule is missed again, whether this job shows
  # up separates "GitHub never triggered the workflow" from "it triggered but
  # nothing picked up the self-hosted job" -- two different problems with two
  # different fixes, and previously indistinguishable from the run list.
  trigger-check:
    name: Confirm the trigger fired
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Log how and when this run started
        run: |
          echo "event   : ${{ github.event_name }}"
          echo "started : $(date -u '+%Y-%m-%d %H:%M:%S') UTC"

  refresh:
    name: Detect + extract new OverKill Shorts
    needs: trigger-check
    outputs:
      # How many picks this run actually extracted -- gates the digest email
      # below so it isn't sent twice a day to say nothing happened.
      new_picks: ${{ steps.scan.outputs.new_picks }}
    # Self-hosted, not ubuntu-latest: GitHub-hosted runners sit on Google
    # Cloud IPs, which YouTube blocks outright from the transcript endpoint
    # (confirmed directly -- see this workflow's git history). A
    # self-hosted runner uses a residential IP instead, sidestepping the
    # block for free instead of paying for a proxy service. Requires a
    # runner registered against this repo and online at schedule time --
    # see the setup steps linked from the repo README / ask Claude.
    runs-on: [self-hosted]
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Temporary diagnostic -- confirms what public IP the runner SERVICE
      # actually sees (not necessarily the same as what your browser shows,
      # if e.g. a VPN only applies to your interactive session). Safe to
      # remove once the IP-block question is settled.
      - name: What IP does the runner see?
        run: |
          (Invoke-WebRequest -Uri "https://api.ipify.org" -UseBasicParsing).Content

      # No actions/setup-python step: its bundled Windows installer failed
      # on this self-hosted runner ("Error happened during Python
      # installation", no further detail given). Self-hosted runners
      # already have whatever's installed on the machine -- unlike
      # ephemeral GitHub-hosted runners, there's no need to provision
      # Python fresh each run.
      #
      # Called by FULL PATH below, not bare `python`/`pip` -- the runner
      # service almost certainly runs as a different Windows account (e.g.
      # SYSTEM) than the interactive user, which doesn't inherit that
      # user's PATH entries (confirmed: `pip` resolves fine interactively,
      # "not recognized" when this workflow runs it). Update this path if
      # Python is ever reinstalled/moved on this machine.
      - name: Install dependencies
        run: |
          & "C:\Users\llcai\AppData\Local\Programs\Python\Python314\python.exe" -m pip install --upgrade pip
          # youtube-transcript-api pinned to the 1.x line, NOT <1.0 -- an
          # earlier version of this workflow pinned <1.0 to keep the old
          # get_transcript() classmethod API, but that old version returns
          # a false "subtitles are disabled" against YouTube's current
          # backend (confirmed: identical video IDs fetch fine on 1.2.4,
          # fail on 0.6.3). Capped below 2.0 so a future breaking major
          # version doesn't silently break this unattended job.
          & "C:\Users\llcai\AppData\Local\Programs\Python\Python314\python.exe" -m pip install requests "youtube-transcript-api>=1.0,<2.0" google-genai

      - name: Run detection + extraction script
        id: scan
        env:
          YOUTUBE_API_KEY:  ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          # Empty on scheduled runs, so cron always scans everything. Only a
          # manual dispatch narrows it.
          SCAN_CHANNELS:    ${{ github.event.inputs.channels }}
          # Python 3.14 on Windows still encodes stdout with the locale
          # codepage (cp1252), so em-dashes etc. in log messages arrive in
          # the Actions log as mojibake. Force UTF-8 rather than restricting
          # log text -- ticker notes from the transcripts aren't ASCII either.
          PYTHONIOENCODING: utf-8
        run: |
          & "C:\Users\llcai\AppData\Local\Programs\Python\Python314\python.exe" scripts\overkill_shorts_scan.py

      - name: Commit updated picks + pending list
        # PowerShell, not bash: `shell: bash` failed with "bash: command not
        # found" on this runner -- same root cause as the earlier python/pip
        # PATH issue (the runner service account's PATH doesn't include Git
        # Bash's location either, even though it's genuinely installed).
        # Rewritten natively instead of chasing a third tool's PATH.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/overkill_shorts.json data/overkill_pending.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Nothing to commit -- no new videos this run."
            exit 0
          }
          git commit -m "Update OverKill Shorts $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')) UTC"
          git pull --rebase -X ours origin main
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Rebase conflict could not be auto-resolved; force-pushing."
            git rebase --abort
            git push --force-with-lease origin main
          } else {
            git push origin main
          }

  # Digest email. Runs on ubuntu-latest rather than the self-hosted runner:
  # the perf table needs yfinance/pandas, which the runner deliberately does
  # NOT have (installing them on its Python 3.14 risks breaking the scan), and
  # nothing here needs a residential IP. Skipped entirely when the scan found
  # no new picks -- twice daily against a channel that doesn't post daily would
  # otherwise mostly deliver "nothing happened".
  email:
    name: Email the Shorts digest
    needs: refresh
    if: needs.refresh.outputs.new_picks != '0' && needs.refresh.outputs.new_picks != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ref: main, not the triggering SHA -- the refresh job pushed a commit
      # after this workflow started, and that commit is the picks we're emailing.
      - name: Checkout repo (latest main, incl. the picks just pushed)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Send digest
        env:
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          OVERKILL_EMAIL_TO:  ${{ secrets.OVERKILL_EMAIL_TO }}
        run: python scripts/headless_overkill_shorts_email.py
