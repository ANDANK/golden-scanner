name: Refresh Over Kill Shorts

on:
  schedule:
    # ── CDT (summer, Mar–Nov): UTC-5 ─────────────────────────────
    # 8:00 AM CDT = 13:00 UTC
    - cron: "0 13 * * *"
    # 7:00 PM CDT = 00:00 UTC (next day)
    - cron: "0 0 * * *"
    # ── CST (winter, Nov–Mar): UTC-6 ─────────────────────────────
    # 8:00 AM CST = 14:00 UTC   ← uncomment these and remove CDT lines in Nov
    # - cron: "0 14 * * *"
    # 7:00 PM CST = 01:00 UTC (next day)
    # - cron: "0 1 * * *"
  workflow_dispatch:          # Manual trigger from GitHub Actions UI

permissions:
  contents: write          # allow the bot to commit + push refreshed picks

# Prevent overlapping runs from duplicate cron fires.
concurrency:
  group: refresh-overkill-shorts
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh Over Kill Shorts picks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests anthropic yt-dlp

      - name: Run refresh script
        env:
          YOUTUBE_API_KEY:    ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/refresh_overkill_shorts.py

      - name: Commit refreshed picks
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/overkill_shorts.json
          if git diff --cached --quiet; then
            echo "Nothing to commit — no new Shorts found."
          else
            git commit -m "Auto-refresh Over Kill Shorts $(date -u +'%Y-%m-%d %H:%M UTC')"

            if git pull --rebase -X ours origin main; then
              git push origin main
            else
              echo "Rebase conflict could not be auto-resolved; force-pushing refreshed picks."
              git rebase --abort
              git push --force-with-lease origin main
            fi
          fi
