name: Noon Reversal Study

# Manual only. This is a one-off research question, not a recurring report —
# and Yahoo serves at most 60 calendar days of intraday bars, so re-running
# it daily would mostly re-derive the same window.
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers"
        required: true
        default: "QQQ,SPY"
        type: string
      interval:
        description: "Bar size (5m recommended; 60d max history)"
        required: true
        default: "5m"
        type: choice
        options: ["5m", "15m", "30m"]
      period:
        description: "Lookback (Yahoo caps intraday at 60d)"
        required: true
        default: "60d"
        type: choice
        options: ["30d", "60d"]

concurrency:
  group: noon-reversal
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  study:
    name: Morning range vs close
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          grep -v "^streamlit" requirements.txt | pip install -r /dev/stdin
      - name: Run study
        env:
          NOON_TICKERS:  ${{ github.event.inputs.tickers  || 'QQQ,SPY' }}
          NOON_INTERVAL: ${{ github.event.inputs.interval || '5m' }}
          NOON_PERIOD:   ${{ github.event.inputs.period   || '60d' }}
        run: python scripts/headless_noon_reversal.py
      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! ls data/noon_reversal/*.json >/dev/null 2>&1; then
            echo "No results written — nothing to commit."; exit 0
          fi
          git add data/noon_reversal/*.json
          if git diff --cached --quiet; then
            echo "Results unchanged."
          else
            git commit -m "Noon reversal study $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git pull --rebase -X ours origin main; then
              git push origin main
            else
              git rebase --abort; git push --force-with-lease origin main
            fi
          fi
