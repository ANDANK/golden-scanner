name: OverKill Scan Email

on:
  schedule:
    # Once daily now (was twice) -- Best Scanners' _evaluate() proved both
    # daytime runs were computing off the exact same completed daily bar
    # (it explicitly drops today's still-forming bar before 4pm ET), so a
    # second same-day run before close was pure duplicate work. OverKill's
    # weekly/monthly bars aren't gated the same way, but a single end-of-day
    # run still captures the most current data for it too. Runs 15 min
    # before Best Scanners' own 5:15 PM CT slot to avoid both hitting
    # yfinance at the exact same moment.
    # ── CDT (summer, Mar–Nov): UTC-5 ─────────────────────────────
    # 5:00 PM CDT = 22:00 UTC
    - cron: "0 22 * * 1-5"
    # ── CST (winter, Nov–Mar): UTC-6 ─────────────────────────────
    # 5:00 PM CST = 23:00 UTC   ← uncomment this and remove the CDT line in Nov
    # - cron: "0 23 * * 1-5"
  workflow_dispatch:          # Manual trigger from GitHub Actions UI
    inputs:
      slot:
        description: "Scan slot (am / pm)"
        required: true
        default: "am"
        type: choice
        options: [am, pm]

# Prevent two runs of the same slot from overlapping (e.g. duplicate cron fires).
concurrency:
  group: overkill-scan-email-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.slot || 'auto' }}
  cancel-in-progress: false

permissions:
  contents: write          # allow the bot to commit + push the daily history snapshot

jobs:
  scan-and-email:
    name: Scan OverKill Universe + Email
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Install everything from requirements.txt except streamlit (mocked in headless mode)
          grep -v "^streamlit" requirements.txt | pip install -r /dev/stdin

      - name: Determine scan slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "14" ] || [ "$HOUR" = "15" ]; then
              echo "slot=am" >> $GITHUB_OUTPUT
            else
              echo "slot=pm" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run OverKill scan + send email
        env:
          SCAN_SLOT:            ${{ steps.slot.outputs.slot }}
          GMAIL_ADDRESS:        ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD:   ${{ secrets.GMAIL_APP_PASSWORD }}
          OVERKILL_EMAIL_TO:    ${{ secrets.OVERKILL_EMAIL_TO }}
          # ── Tune these to change scan behaviour without editing code ──
          OVERKILL_MIN_STARS:      "3"   # only email 3-5 star results
          OVERKILL_WEEKLY_FRESH:   "6"   # matches the live Scan Universe UI default
          OVERKILL_MONTHLY_FRESH:  "3"   # badge-only, doesn't gate inclusion
        run: python scripts/headless_overkill_scan.py

      - name: Commit history snapshot JSON
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/overkill/*.json
          if git diff --cached --quiet; then
            echo "Nothing to commit — no history snapshot was written this run."
          else
            git commit -m "OverKill history snapshot $(date -u +'%Y-%m-%d %H:%M UTC') [${{ steps.slot.outputs.slot }}]"

            # Pull any remote commits made since checkout.
            # -X ours: on add/add conflict with today's own snapshot file
            # (duplicate cron fires), always keep THIS run's fresh data.
            if git pull --rebase -X ours origin main; then
              git push origin main
            else
              # Rebase left repo in a broken state — abort cleanly then force-push
              # our snapshot so it's never silently lost.
              echo "Rebase conflict could not be auto-resolved; force-pushing snapshot."
              git rebase --abort
              git push --force-with-lease origin main
            fi
          fi
